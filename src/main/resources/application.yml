spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_sync?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: UTC
  main:
    allow-bean-definition-overriding: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

openapi:
  order:
    base-url: https://open-api.example.com
    list-path: /orders
    client-id: your-app-id
    client-secret: your-app-secret
    page-size: 50
    connect-timeout: 5s
    read-timeout: 15s
